# Workout Tracker — one checkout, three instances.
#
#   main     :8035  volume workout-tracker-data          (Jason)
#   wife     :8036  volume workout-tracker-wife-data
#   staging  :8037  volume workout-tracker-staging-data  (copy of main's data, see scripts/seed-staging.sh)
#
# Each instance is a compose PROFILE with its own frontend+backend pair on a
# private network (the backend is aliased `backend` so nginx.conf's
# `proxy_pass http://backend:3001` works unchanged). All three run the same two
# images, tagged by git commit via TAG (scripts/ship.sh sets it; default latest).
#
#   scripts/ship.sh main            # tests → gate → backup → build → up (use this)
#   docker compose --profile main up -d --build   # manual equivalent, TAG=latest
#
# With no --profile, `docker compose up` starts NOTHING — that is deliberate.
# Volumes are external: compose never creates or removes real data.

name: workout-tracker

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile.backend
  image: workout-tracker-backend:${TAG:-latest}
  environment:
    - NODE_ENV=production
    - PORT=3001
    - DB_PATH=/data/database.sqlite
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s

x-frontend: &frontend
  build:
    context: .
    dockerfile: Dockerfile.frontend
  image: workout-tracker-frontend:${TAG:-latest}
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  # ---- main (:8035) ----
  backend-main:
    <<: *backend
    profiles: [main]
    container_name: workout-tracker-backend
    volumes:
      - main-data:/data
    networks:
      main:
        aliases: [backend]

  frontend-main:
    <<: *frontend
    profiles: [main]
    container_name: workout-tracker-frontend
    ports:
      - "8035:80"
    networks: [main]
    depends_on:
      backend-main:
        condition: service_healthy

  # ---- wife (:8036) ----
  backend-wife:
    <<: *backend
    profiles: [wife]
    container_name: workout-tracker-wife-backend
    volumes:
      - wife-data:/data
    networks:
      wife:
        aliases: [backend]

  frontend-wife:
    <<: *frontend
    profiles: [wife]
    container_name: workout-tracker-wife-frontend
    ports:
      - "8036:80"
    networks: [wife]
    depends_on:
      backend-wife:
        condition: service_healthy

  # ---- staging (:8037) ----
  backend-staging:
    <<: *backend
    profiles: [staging]
    container_name: workout-tracker-staging-backend
    volumes:
      - staging-data:/data
    networks:
      staging:
        aliases: [backend]

  frontend-staging:
    <<: *frontend
    profiles: [staging]
    container_name: workout-tracker-staging-frontend
    ports:
      - "8037:80"
    networks: [staging]
    depends_on:
      backend-staging:
        condition: service_healthy

networks:
  main:
    name: workout-tracker-net-main
  wife:
    name: workout-tracker-net-wife
  staging:
    name: workout-tracker-net-staging

volumes:
  main-data:
    name: workout-tracker-data
    external: true
  wife-data:
    name: workout-tracker-wife-data
    external: true
  staging-data:
    name: workout-tracker-staging-data
    external: true   # created once: docker volume create workout-tracker-staging-data

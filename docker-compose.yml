services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: workout-tracker-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/database.sqlite
    volumes:
      - workout-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: workout-tracker-frontend
    ports:
      - "8035:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  default:
    name: workout-tracker-network

volumes:
  workout-data:
    name: workout-tracker-data
